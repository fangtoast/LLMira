name: llmira

x-service-env: &service-env
  NODE_ENV: production
  DATABASE_URL: postgres://llmira:${POSTGRES_PASSWORD:-change-me}@postgres:5432/llmira
  REDIS_URL: redis://redis:6379
  ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?set ENCRYPTION_MASTER_KEY}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: llmira
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-llmira}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TEAM_API_URL: ${NEXT_PUBLIC_TEAM_API_URL:-}
    environment:
      LLMIRA_SITE_ADDRESS: ${LLMIRA_SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *service-env
      PORT: 4000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *service-env
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-}
      MCP_CONTAINER_RUNTIME: ${MCP_CONTAINER_RUNTIME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: llmira
      POSTGRES_USER: llmira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmira -d llmira"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-llmira}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set llmira http://minio:9000 ${MINIO_ROOT_USER:-llmira} ${MINIO_ROOT_PASSWORD:-change-me}
        && mc mb --ignore-existing llmira/llmira

  ocr:
    image: jbarlow83/ocrmypdf:latest
    profiles: ["ocr"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'OCR profile ready; worker submits isolated one-shot jobs.' && sleep infinity"]
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true

  backup-db:
    image: prodrigestivill/postgres-backup-local:17
    profiles: ["ops"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: llmira
      POSTGRES_USER: llmira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SCHEDULE: "0 3 * * *"
      BACKUP_KEEP_DAYS: 14
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy

  backup-objects:
    image: minio/mc:latest
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set source http://minio:9000 ${MINIO_ROOT_USER:-llmira} ${MINIO_ROOT_PASSWORD:-change-me};
        while true; do mc mirror --overwrite source/llmira /backup/llmira; sleep 86400; done
    volumes:
      - ./backups/objects:/backup
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
