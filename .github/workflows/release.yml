# Purpose: Build Windows and Android packages and publish one GitHub prerelease.
# Author: fangtoast <fangtoast@foxmail.com>
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --global npm@11.6.0
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run check
      - run: npm run tauri:build:windows
      - name: Verify Windows installers
        shell: pwsh
        run: |
          if (-not (Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue)) { throw "Windows NSIS installer is missing" }
          if (-not (Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi -ErrorAction SilentlyContinue)) { throw "Windows MSI installer is missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: llmira-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm install --global npm@11.6.0
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run check
      - run: npm run tauri:android:init -- --ci
      - name: Prepare Android signing material
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
            : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
            : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/llmira-release.jks"
            echo "LLMIRA_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/llmira-release.jks" >> "$GITHUB_ENV"
            echo "LLMIRA_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "LLMIRA_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "LLMIRA_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "LLMIRA_ANDROID_SIGNING_MODE=release" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt -storetype JKS \
              -keystore "$RUNNER_TEMP/llmira-development.jks" \
              -storepass llmira-development -keypass llmira-development \
              -alias llmira-development -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=LLMira Development, OU=Developer Preview, O=LLMira, C=CN"
            echo "LLMIRA_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/llmira-development.jks" >> "$GITHUB_ENV"
            echo "LLMIRA_ANDROID_KEYSTORE_PASSWORD=llmira-development" >> "$GITHUB_ENV"
            echo "LLMIRA_ANDROID_KEY_ALIAS=llmira-development" >> "$GITHUB_ENV"
            echo "LLMIRA_ANDROID_KEY_PASSWORD=llmira-development" >> "$GITHUB_ENV"
            echo "LLMIRA_ANDROID_SIGNING_MODE=development" >> "$GITHUB_ENV"
          fi
      - run: node scripts/configure-android-signing.mjs
      - run: npm run tauri:build:android -- --target aarch64 --ci
      - name: Verify Android packages
        shell: bash
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit | grep -q . || { echo "Android APK is missing" >&2; exit 1; }
          find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit | grep -q . || { echo "Android AAB is missing" >&2; exit 1; }
      - name: Record Android signing mode
        shell: bash
        run: echo "$LLMIRA_ANDROID_SIGNING_MODE" > src-tauri/gen/android/app/build/outputs/SIGNING_MODE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: llmira-android-arm64
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/app/build/outputs/SIGNING_MODE.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-x64, android-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
      - name: Create checksums
        shell: bash
        run: |
          mkdir -p dist
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            [[ ! -e "dist/$name" ]] || { echo "Duplicate release asset: $name" >&2; exit 1; }
            cp "$asset" "dist/$name"
          done < <(find release-assets -type f ! -name SIGNING_MODE.txt -print0)
          test "$(find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.apk' -o -name '*.aab' \) | wc -l)" -ge 4
          (cd dist && sha256sum * > ../SHA256SUMS.txt)
      - name: Publish Developer Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "LLMira $GITHUB_REF_NAME · Developer Preview" \
            --notes "个人对话核心版：Windows x64 与 Android arm64 安装后可在设备上直连 OpenAI-compatible Provider，Web 版需要自托管 LLMira 网关。Windows 可能未使用受信任发布者证书；Android 在未配置正式 Secret 时使用 CI 开发签名。"
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
