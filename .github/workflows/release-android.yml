name: release-android

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      - run: npm run build
      - run: npm run tauri:android:init -- --ci
      - name: Configure Android signing
        working-directory: src-tauri/gen/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Android signing secrets are not configured; producing an unsigned build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          printf 'password=%s\nkeyAlias=%s\nstoreFile=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$PWD/upload-keystore.jks" "$KEY_PASSWORD" > keystore.properties
      - run: npm run tauri:build:android -- --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: llmira-android-arm64
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
