[package]
name = "llmira"
version = "0.1.0"
description = "LLMira team AI workbench"
authors = ["fangtoast <fangtoast@foxmail.com>"]
edition = "2021"

[lib]
name = "llmira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
tauri-plugin-http = "2"

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
