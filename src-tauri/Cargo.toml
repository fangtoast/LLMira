[package]
name = "llmira"
version = "0.2.0-dev.1"
description = "LLMira personal AI client with optional team collaboration"
authors = ["fangtoast <fangtoast@foxmail.com>"]
edition = "2021"

[lib]
name = "llmira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
tauri-plugin-keyring-store = { version = "0.2.0", default-features = false }
tauri-plugin-http = "2"
rmcp = { version = "3.1.2", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
http = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rmcp = { version = "3.1.2", features = ["transport-child-process"] }
tokio = { version = "1", features = ["process"] }

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
